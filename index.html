<!doctype html>
<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" charset="utf-8" />
  </head>
  <body>
    <div class="header">
      <img class="header-img" src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix" />
      <a class="more-info" href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details?</a
      >
    </div>
    <div class="app">
      <div class="new-task-form">
        <label class="form-label" for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task" class="task-input" type="text" />
          <button class="add-btn">Add</button>
        </div>
      </div>
      <h3 class="list-heading">Todo</h3>
      <ul id="incomplete-tasks" class="task-list">
        <li class="task-item">
          <input class="task-checkbox" type="checkbox" />
          <label class="task-label">Pay Bills</label>
          <input type="text" class="task-edit-input" />
          <button class="edit-btn">Edit</button>
          <button class="delete-btn">
            <img class="delete-icon" src="./remove.svg" alt="Delete" />
          </button>
        </li>
        <li class="task-item editMode">
          <input class="task-checkbox" type="checkbox" />
          <label class="task-label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task-edit-input" />
          <button class="edit-btn">Save</button>
          <button class="delete-btn">
            <img class="delete-icon" src="./remove.svg" alt="Delete" />
          </button>
        </li>
      </ul>
      <h3 class="list-heading">Completed</h3>
      <ul id="completed-tasks" class="task-list completed">
        <li class="task-item">
          <input class="task-checkbox" type="checkbox" checked />
          <label class="task-label">See the Doctor</label>
          <input type="text" class="task-edit-input" />
          <button class="edit-btn">Edit</button>
          <button class="delete-btn">
            <img class="delete-icon" src="./remove.svg" alt="Delete" />
          </button>
        </li>
      </ul>
    </div>
    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
